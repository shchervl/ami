[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ami"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["sqlalchemy>=2.0"]

[project.scripts]
ami = "ami.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ami*"]

[tool.setuptools.package-data]
ami = ["assets/*"]
